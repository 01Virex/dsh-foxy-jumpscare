name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validation (syntax / JSON / manifest / dsh contract)
        run: node scripts/validate.cjs

  release:
    name: Build & publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VER}"
            exit 1
          fi
          echo "Releasing dsh-foxy-jumpscare v${TAG}"

      - name: Package release files
        run: node scripts/package-release.cjs

      - name: Create zip
        shell: bash
        run: |
          cd dist-release
          zip -r "dsh-foxy-jumpscare-${GITHUB_REF_NAME#v}.zip" dsh-foxy-jumpscare

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
